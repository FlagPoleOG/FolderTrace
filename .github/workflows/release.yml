name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.2.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.Version=${VERSION}" \
            -o dist/FolderTrace.exe .
          cd dist
          zip FolderTrace-${TAG}-windows-amd64.zip FolderTrace.exe
          sha256sum FolderTrace.exe FolderTrace-${TAG}-windows-amd64.zip > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/FolderTrace.exe
            dist/FolderTrace-${{ env.TAG }}-windows-amd64.zip
            dist/SHA256SUMS.txt
